services:
  runplan:
    build:
      context: .
    image: "${RUNPLAN_IMAGE:-runplan:local}"
    restart: unless-stopped
    ports:
      - "${RUNPLAN_HOST_IP:?Set RUNPLAN_HOST_IP in .env}:${RUNPLAN_HOST_PORT:?Set RUNPLAN_HOST_PORT in .env}:8000"
    volumes:
      - ./runplan-data:/data
    environment:
      RUNPLAN_DEFAULT_PACE: "${RUNPLAN_DEFAULT_PACE:-6:00 min/km}"
      RUNPLAN_MINIMAX_API_KEY: "${RUNPLAN_MINIMAX_API_KEY:-}"
      RUNPLAN_WEB_PASSWORD_HASH: "${RUNPLAN_WEB_PASSWORD_HASH:-}"
      RUNPLAN_WEB_PASSWORD: "${RUNPLAN_WEB_PASSWORD:-}"
      RUNPLAN_WEB_REQUIRE_HTTPS: "${RUNPLAN_WEB_REQUIRE_HTTPS:-true}"
      RUNPLAN_WEB_TRUST_PROXY: "${RUNPLAN_WEB_TRUST_PROXY:-false}"
    init: true

volumes:
  runplan-data:
