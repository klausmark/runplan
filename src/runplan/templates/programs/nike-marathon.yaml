program:
  id: nike-marathon
  name: Nike Run Club - Marathon Training Plan
  short_name: NMAR
  description: >-
    Unofficial adaptation of the Nike Run Club Marathon Training Plan. Pace
    targets reference the Nike Run Club Pace Chart (Best, Mile, 5K, 10K, Tempo,
    Recovery, Marathon) and must be filled in by the runner. Speed Runs build
    strength, three weekly Recovery Runs let you absorb the work, and a Long
    Run grows endurance. Avoid scheduling Speed Runs and Long Runs on
    back-to-back days.
  start_week: 2027-W01

weeks:
  - week: 1
    focus: 18 weeks to go - Three recovery runs, one speed, one long
    workouts:
      - id: recovery-10
        day: 1
        name: Recovery Run
        description: Progression Runs build pace from slower than Recovery pace to faster than Recovery pace. Your Long and Recovery Runs should be run as Progression Runs.
        steps:
          - run: {time: 10m, note: "10:00 Recovery Run"}
      - id: speed-intervals
        day: 2
        name: Speed Run - Intervals
        description: Intervals are a Speed Run with running and rest intervals.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 8
              steps:
                - run: {time: 1m, note: "1:00 5K Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
      - id: recovery-two-mile
        day: 4
        name: Recovery Run
        steps:
          - run: {distance: 3.2km, note: "3.2K / 2 Mile Recovery Run"}
      - id: recovery-7
        day: 5
        name: Recovery Run
        steps:
          - run: {time: 7m, note: "7:00 Recovery Run"}
      - id: long-five-mile
        day: 7
        name: Long Run
        steps:
          - run: {distance: 8km, note: "8K / 5 Mile Run"}
  - week: 2
    focus: 17 weeks to go - Pyramid intervals and 10K long run
    workouts:
      - id: recovery-15-a
        day: 1
        name: Recovery Run
        steps:
          - run: {time: 15m, note: "15:00 Recovery Run"}
      - id: recovery-5k-a
        day: 3
        name: Recovery Run
        steps:
          - run: {distance: 5km, note: "5K / 3.1 Mile Recovery Run"}
      - id: speed-pyramid
        day: 4
        name: Speed Run - Intervals
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 1m, note: "1:00 5K Pace"}
          - run: {time: 2m, note: "2:00 10K Pace"}
          - run: {time: 1m, note: "1:00 5K Pace"}
          - repeat:
              count: 2
              steps:
                - run: {time: 45s, note: "0:45 Mile Pace"}
          - run: {time: 2m, note: "2:00 10K Pace"}
          - run: {time: 1m, note: "1:00 5K Pace"}
          - run: {time: 45s, note: "0:45 Mile Pace"}
          - run: {time: 30s, note: "0:30 Best Pace"}
          - run: {time: 15s, note: "0:15 Best Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery between all intervals"}
      - id: recovery-one-mile-a
        day: 5
        name: Recovery Run
        steps:
          - run: {distance: 1.6km, note: "1.6K / 1 Mile Recovery Run"}
      - id: long-10k-a
        day: 7
        name: Long Run
        steps:
          - run: {distance: 10km, note: "10K / 6.2 Mile Run"}
  - week: 3
