        description: Fartlek is Swedish for speed play. Alternate 1:00 hard with 2:00 easy for 21:00.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 7
              steps:
                - run: {time: 1m, note: "1:00 Hard Running"}
