          - repeat:
              count: 3
              steps:
                - run: {time: 1m30s, note: "1:30 5K Pace"}
                - recovery: {time: 1m30s, note: "1:30 between each interval"}
                - run: {time: 1m30s, note: "1:30 10K Pace"}
                - recovery: {time: 1m30s, note: "1:30 between each interval"}
                - run: {time: 1m30s, note: "1:30 Mile Pace"}
                - recovery: {time: 1m30s, note: "1:30 between each interval"}
      - id: guided-thank-you-run
        day: 3
        name: NRC Guided Run - Thank You Run
