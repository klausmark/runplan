        day: 1
        name: NRC Guided Run - 7 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 7 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-deuces
        day: 2
        name: NRC Guided Run - Deuces
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 10
              steps:
                - run: {time: 2m, note: "2:00 5K Pace"}
                - recovery: {time: 1m, note: "1:00 recovery (after intervals #4 and #8 use 2:00)"}
      - id: guided-just-another-run
        day: 3
        name: NRC Guided Run - Just Another Run
        steps:
          - run: {time: 35m, note: "NRC Guided Run: Just Another Run - 35:00 Recovery Run"}
      - id: guided-one-hard-one-easy
        day: 4
        name: NRC Guided Run - One Hard. One Easy.
        description: Fartlek is Swedish for speed play. Alternate 1:00 hard with 1:00 easy for 15:00.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 8
              steps:
                - run: {time: 1m, note: "1:00 Hard Running"}
                - recovery: {time: 1m, note: "1:00 Easy Running"}
      - id: guided-ten-mile-run
        day: 6
        name: NRC Guided Run - Ten Mile Run
        steps:
          - run: {distance: 16km, note: "NRC Guided Run: Ten Mile Run - 16K / 10 Mile Run"}
  - week: 9
    focus: 6 weeks to go - Rock n Roller and 8K Tempo
    workouts:
      - id: guided-6w-recovery
        day: 1
        name: NRC Guided Run - 6 Weeks to Go
