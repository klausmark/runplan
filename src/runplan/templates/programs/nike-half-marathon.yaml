      examples:
        - title: "If your last 5K was 31:40"
          row: ["5:40", "31:40 / 6:20", "1:06:40 / 6:40", "6:40", "2:27:41 / 7:00", "5:09:26 / 7:20", "7:20"]
          targets:
            - "Best 1K Pace: 5:40 min/km"
            - "5K Pace: 31:40 / 6:20 min/km"
            - "10K Pace: 1:06:40 / 6:40 min/km"
            - "Tempo Pace: 6:40 min/km"
            - "Marathon Pace: 5:09:26 / 7:20 min/km"
        - title: "If your Best 1K time is 5:00"
          row: ["5:00", "27:55 / 5:35", "58:20 / 5:50", "5:55", "2:10:06 / 6:10", "4:34:16 / 6:30", "6:35"]
          targets:
            - "Best 1K Pace: 5:00 min/km"
            - "5K Pace: 27:55 / 5:35 min/km"
            - "10K Pace: 58:20 / 5:50 min/km"
            - "Tempo Pace: 5:55 min/km"
            - "Marathon Pace: 4:34:16 / 6:30 min/km"
    glossary:
      - term: "Audio Guided Run"
        definition: >-
          The Nike Run Club app offers a library of Audio Guided Runs. You can find
          long and short runs, duration as well as distance-based runs and speed
          runs of all types including fartlek, interval and tempo runs. Some of our
          best coaches and athletes will meet you at the starting line to guide,
          motivate and inspire you to a better run. Every run in this plan has an
          accompanying Audio Guided Run. You can run alone, or you can run with us.
          As always, the choice is yours.
      - term: "Progression Run"
        definition: >-
          Progression Runs improve stamina and allow the body to adapt to the
          stress of running. Build your pace over the course of each run by
          starting at a slower than Recovery Run pace and finishing at a faster
          than Recovery Run pace. Over the course of the run you will average your
          Recovery Run pace. This progression from the slowest running of the run
          to the fastest running of the run allows your body to ease into the run
          and adjust to the activity of running in a natural way. Your Long and
          Recovery Runs should be run as Progression Runs.
      - term: "Intervals"
        definition: >-
          Intervals refer to a Speed Run session that includes a set of running
          and rest intervals. There are any number of variations one could use when
          doing an interval Speed Run. The distance or duration as well as the
          pace and effort of the running interval can remain the same or change
          over the course of the workout. The recovery interval duration is another
          element of the Speed Run that can remain static or change during the
          workout. Ideally a session like this takes place on a track but does
          not need to. Any location that allows you to run freely is suitable for
          an interval-based Speed Run.
      - term: "Fartlek"
        definition: >-
          Fartlek is loosely translated from Swedish to "speed play". Fartlek
          works on speed and strength by alternating distances and paces during a
          continuous run. An example Fartlek workout structure could be one
          minute running easy followed by one minute running hard, repeated for a
          certain amount of minutes, miles or alternating every city block.
      - term: "Hills"
        definition: >-
          Hill workouts develop speed and form. It takes extra effort to run
          uphill so you do not need to run as fast as you would on a flat
          section. While running uphill, remain in control of your breathing.
          Don't lean too far forward. A light lean with the chin leading the
          chest is enough. Running up hills is a great way to develop speed and
          strength with minimal pounding on the legs. It's best to use effort as
          a guide rather than pace when doing a hill workout.
      - term: "Tempo Run"
        definition: >-
          A Tempo Run is a hard but controlled pace that can be run as long
          intervals or a steady run of 1-10 miles. The purpose of a Tempo Run is
          to build mental and physical endurance and to become comfortable being
          uncomfortable.
    pace_types:
      - {name: "Best Pace", effort: "10 out of 10", description: "This is the pace that makes you feel like you are at your best. Sometimes this may mean your fastest and sometimes this will mean running easier. The pace and effort you run will be your choice."}
      - {name: "1K Pace", effort: "9 out of 10", description: "This is the pace you could race or run hard for one kilometer."}
      - {name: "5K Pace", effort: "7-8 out of 10", description: "This is the pace you could race or run hard for about 3 miles."}
      - {name: "10K Pace", effort: "6-7 out of 10", description: "This is the pace you could race or run hard for about 6 miles."}
      - {name: "Tempo Pace", effort: "6 out of 10", description: "Teaching your body to be comfortable being uncomfortable by maintaining a hard pace and effort that is close to 30-35 seconds slower than your 5K pace."}
      - {name: "Recovery Pace", effort: "4-5 out of 10", description: "A pace easy enough that you can talk, laugh or argue freely while running."}
    things_to_know:
      - "When in doubt be sure to focus on effort. Paces can change due to many factors including but not limited to changes in fitness, weather, elevation, stress, fatigue, and lack of sleep. Be sure to listen to your body and not just focus on the numbers on your watch or phone."
      - "As you make your way through the training there will be days you may be a little ahead of pace, and other days a little behind. Remember that the paces are only to be used as a guide. You will have good days and bad days as an athlete. Be flexible with your expectations. Hopefully, you will be increasing your fitness each week and your paces will increase in speed as you go."
      - "When this plan is completed and you head out for race day be confident in all the work you have done. It is that work that will take you to new fitness levels, faster paces, this starting line and all the ones beyond."
    situational_advice:
      - title: "If your schedule does not match the training schedule"
        body: >-
          Then adjust the training schedule to your needs. No training plan should
          ever be seen as written in stone. Instead, look at this training program
          as written in pencil and you have both an eraser and a pencil to make
          adjustments as you see fit. You are not only the athlete here... you are
          also the Head Coach. For best results, be sure to space out hard efforts
          like Speed Runs and Long Runs. Use the Recovery Runs and Rest Days to
          allow your body to recharge from the harder efforts.
      - title: "If you don't know how to figure out your pace"
        body: >-
          Then experiment until you find it. When you're out running, you run on
          feel. You have different gears whether you realize it or not. Be patient,
          pay attention and have fun experimenting with your comfort level while
          running at different speeds across different distances. Use the Nike Run
          Club App while you run to keep track of your paces, and use our Pace
          Chart guidelines to find your pace targets.
      - title: "If you're tired"
        body: >-
          Figure out why. Feeling fatigued is normal as your training progresses,
          but make sure you're supporting yourself in all other aspects of your
          life: get enough sleep, eat right, hydrate properly, respect Recovery
          days and wear the proper shoes. Sometimes the best training is to focus
          on recovery and rest.
      - title: "If you lack motivation"
        body: >-
          Look for inspiration. Even where you don't expect to find it - like on
          a run that you don't want to do. And remember, if you are willing to
          look for motivation that means you've already got some! Be kind and
          patient with yourself... and you'll find that inspiration and motivation
          you need.
      - title: "If you have a terrible run"
        body: >-
          Move on to the next one. Some runs are just terrible - sometimes there's
          no reason, sometimes there is. Take a moment to see if there's a reason
          and learn something about yourself if there is. Being comfortable with a
          bad run is just as important as the joy of a great run.
      - title: "If you're hurt"
        body: >-
          Stop running. There is a difference between hurting and being hurt. It's
          essential to listen to and learn from your body throughout your
          training. Sometimes missing miles in the present lets you run better
          miles in the future. We know it's not easy for an athlete to hold back
          or take off some days. That's why it's important you look at yourself as
          both an athlete and a coach.
      - title: "If you feel like you need to adjust the recommended training on any given day"
        body: >-
          Adjust! Remember, this program is a guide. The daily training recommended
          here is meant to serve as a starting point for you each day. We hope to
          give you the guidance you need to be able to coach yourself as to when
          to push forward, when to pull back and when it is best to maintain.
          The best coach for you is you because you know your fitness better than
          anyone else. Some days you will run the recommended training and other
          days you will run more or less. Listen to your body.
      - title: "If you are going to race"
        body: >-
          Give yourself time to recover - beforehand and afterwards. You may want
          to back off in terms of distance or pace a few days prior to the race.
          Be sure to give yourself a few days of rest and recovery after it's
          over, too (regardless of whether or not you consider it a successful
          race).

weeks:
  - week: 1
    focus: 14 weeks to go - Easy introduction
    workouts:
      - id: guided-14w-recovery
        day: 1
        name: NRC Guided Run - 14 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 14 Weeks to Go - 15:00 Recovery Run", pace_type: recovery}
      - id: guided-first-speed
        day: 2
        name: NRC Guided Run - First Speed Run
        description: Intervals are a Speed Run with running and rest intervals. The pace and effort of the running interval can stay the same or change.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 8
              steps:
                - run: {time: 1m, note: "1:00 5K Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
      - id: guided-easy-run
        day: 3
        name: NRC Guided Run - Easy Run
        steps:
          - run: {time: 25m, note: "NRC Guided Run: Easy Run - 25:00 Recovery Run", pace_type: recovery}
      - id: guided-one-hard-two-easy
        day: 4
        name: NRC Guided Run - One Hard Two Easy
        description: Fartlek is Swedish for speed play. Alternate distances and paces during a continuous run.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 7
              steps:
                - run: {time: 1m, note: "1:00 Hard Running"}
                - recovery: {time: 2m, note: "2:00 Easy Running"}
      - id: guided-5k-run
        day: 6
        name: NRC Guided Run - 5K Run
        steps:
          - run: {distance: 5km, note: "NRC Guided Run: 5K Run - 5K / 3.1 Mile Run", pace_type: 5k}
  - week: 2
    focus: 13 weeks to go - Pace ladders and 4-mile long run
    workouts:
      - id: guided-13w-recovery
        day: 1
        name: NRC Guided Run - 13 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 13 Weeks to Go - 15:00 Recovery Run", pace_type: recovery}
      - id: guided-no-time-go-time
        day: 2
        name: NRC Guided Run - No Time Go Time
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 1m, note: "1:00 1K Pace", pace_type: 1k}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals", pace_type: recovery}
          - run: {time: 2m, note: "2:00 5K Pace", pace_type: 5k}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals", pace_type: recovery}
          - run: {time: 3m, note: "3:00 10K Pace", pace_type: 10k}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals", pace_type: recovery}
          - run: {time: 2m, note: "2:00 5K Pace", pace_type: 5k}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals", pace_type: recovery}
          - run: {time: 1m, note: "1:00 1K Pace", pace_type: 1k}
      - id: guided-recovery-headspace
        day: 3
        name: NRC Guided Run - Recovery Run with Headspace
        steps:
          - run: {time: 35m, note: "NRC Guided Run: Recovery Run with Headspace - 35:00 Run", pace_type: recovery}
      - id: guided-run-strong-repeat
        day: 4
        name: NRC Guided Run - Run Strong. Repeat.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 4
              steps:
                - run: {time: 1m30s, note: "1:30 5K Pace"}
                - recovery: {time: 45s, note: "45 second Recovery after 5K Pace Intervals"}
          - run: {time: 1m30s, note: "1:30 1K Pace", pace_type: 1k}
          - recovery: {time: 1m, note: "1:00 recovery after 1K Pace Interval", pace_type: 1k}
          - repeat:
              count: 4
              steps:
                - run: {time: 1m30s, note: "1:30 5K Pace"}
                - recovery: {time: 45s, note: "45 second Recovery after 5K Pace Intervals"}
          - run: {time: 1m30s, note: "1:30 1K Pace", pace_type: 1k}
      - id: guided-four-mile-run
        day: 6
        name: NRC Guided Run - Four Mile Run
        steps:
          - run: {distance: 6.4km, note: "NRC Guided Run: Four Mile Run - 6.4K / 4 Mile Run"}
  - week: 3
    focus: 12 weeks to go - Hills and Triple 7's
    workouts:
      - id: guided-12w-recovery
        day: 1
        name: NRC Guided Run - 12 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 12 Weeks to Go - 15:00 Recovery Run", pace_type: recovery}
      - id: guided-runner-up
        day: 2
        name: NRC Guided Run - Runner Up
        description: Hill workouts develop speed and form. Stay in control of your breathing and lean slightly with the chin leading the chest. Use effort rather than pace.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 5
              steps:
                - run: {time: 45s, note: "45 seconds 10K Effort"}
                - recovery: {time: 1m15s, note: "1:15 after 10K effort"}
                - run: {time: 15s, note: "15 seconds Best Effort"}
                - recovery: {time: 45s, note: "45 seconds after Best Effort"}
      - id: guided-just-a-run
        day: 3
        name: NRC Guided Run - Just A Run
        steps:
          - run: {time: 30m, note: "NRC Guided Run: Just A Run - 30:00 Recovery Run", pace_type: recovery}
      - id: guided-triple-7s
        day: 4
        name: NRC Guided Run - Triple 7's
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 3
              steps:
                - run: {time: 7m, note: "7:00 5K Pace"}
                - recovery: {time: 2m30s, note: "2:30 Recovery between intervals"}
      - id: guided-five-mile-run
        day: 6
        name: NRC Guided Run - Five Mile Run
        steps:
          - run: {distance: 8km, note: "NRC Guided Run: Five Mile Run - 8K / 5 Mile Run"}
  - week: 4
    focus: 11 weeks to go - The Rundown and Tempo with Emily Infeld
    workouts:
      - id: guided-11w-recovery
        day: 1
        name: NRC Guided Run - 11 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 11 Weeks to Go - 15:00 Recovery Run", pace_type: recovery}
      - id: guided-the-rundown
        day: 2
        name: NRC Guided Run - The Rundown
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 3
              steps:
                - run: {time: 1m, note: "1:00 1K Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery after 1K Pace"}
          - repeat:
              count: 3
              steps:
                - run: {time: 2m, note: "2:00 5K Pace"}
                - recovery: {time: 1m30s, note: "1:30 Recovery after 5K Pace"}
          - repeat:
              count: 2
              steps:
                - run: {time: 1m, note: "1:00 1K Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery after 1K Pace"}
          - repeat:
              count: 2
              steps:
                - run: {time: 2m, note: "2:00 5K Pace"}
                - recovery: {time: 1m30s, note: "1:30 Recovery after 5K Pace"}
          - run: {time: 1m, note: "1:00 1K Pace", pace_type: 1k}
          - recovery: {time: 1m, note: "1:00 Recovery after 1K Pace", pace_type: 1k}
          - run: {time: 2m, note: "2:00 5K Pace", pace_type: 5k}
      - id: guided-running-towards-goal
        day: 3
        name: NRC Guided Run - Running Towards Your Goal with Headspace
        steps:
          - run: {time: 40m, note: "NRC Guided Run: Running Towards Your Goal with Headspace - 40:00 Recovery Run", pace_type: recovery}
      - id: guided-tempo-emily
        day: 4
        name: NRC Guided Run - Tempo Run with Emily Infeld
        description: A Tempo Run is a hard but controlled pace run as long intervals or a steady run of 1-10 miles. The purpose is to build mental and physical endurance and become comfortable being uncomfortable.
        steps:
          - warmup: {time: 7m, note: "7:00 Warm Up"}
          - run: {time: 25m, note: "25:00 Tempo Run", pace_type: tempo}
      - id: guided-10k-run
        day: 6
