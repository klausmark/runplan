      - id: guided-rock-n-roller
        day: 2
        name: NRC Guided Run - Rock n Roller
        steps:
          - warmup: {time: 6m, note: "6:00 Warm Up"}
          - run: {time: 5m, note: "5:00 10K Pace"}
          - recovery: {time: 1m30s, note: "1:30 Recovery after 10K Pace"}
          - run: {time: 2m30s, note: "2:30 5K Pace"}
          - recovery: {time: 1m30s, note: "1:30 Recovery after 5K Pace"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery after Mile Pace"}
          - run: {time: 30s, note: "0:30 Best Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery after Best Pace"}
          - run: {time: 30s, note: "0:30 Best Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery after Best Pace"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery"}
          - run: {time: 2m30s, note: "2:30 5K Pace"}
          - recovery: {time: 1m30s, note: "1:30 Recovery"}
          - run: {time: 5m, note: "5:00 10K Pace"}
      - id: guided-suckcess-run
        day: 3
        name: NRC Guided Run - Suckcess Run
        steps:
          - run: {time: 35m, note: "NRC Guided Run: Suckcess Run - 35:00 Recovery Run"}
