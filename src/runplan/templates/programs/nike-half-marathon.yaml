          - run: {distance: 8km, note: "8K Tempo Run"}
          - cooldown: {distance: 2km, note: "2K Cool Down"}
      - id: guided-another-ten-mile-run
        day: 6
        name: NRC Guided Run - Another Ten Mile Run
        steps:
          - run: {distance: 16km, note: "NRC Guided Run: Another Ten Mile Run - 16K / 10 Mile Run"}
