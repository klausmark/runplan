      - id: guided-9w-recovery
        day: 1
        name: NRC Guided Run - 9 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 9 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-run-fast-repeat
        day: 2
        name: NRC Guided Run - Run Fast. Repeat.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 30s, note: "0:30 5K Pace (interval #1)"}
          - recovery: {time: 1m, note: "1:00 recovery between intervals"}
          - repeat:
              count: 9
              steps:
                - run: {time: 30s, note: "0:30 Mile Pace"}
                - recovery: {time: 1m, note: "1:00 recovery between intervals"}
          - run: {time: 30s, note: "0:30 5K Pace (interval #11)"}
          - recovery: {time: 1m, note: "1:00 recovery between intervals"}
          - repeat:
              count: 9
              steps:
                - run: {time: 30s, note: "0:30 Mile Pace"}
                - recovery: {time: 1m, note: "1:00 recovery between intervals"}
      - id: guided-shalane-flanagan
        day: 3
        name: NRC Guided Run - Run with Shalane Flanagan
        steps:
          - run: {time: 45m, note: "NRC Guided Run: Run with Shalane Flanagan - 45:00 Recovery Run"}
      - id: guided-hill-hillier-hilliest
        day: 4
        name: NRC Guided Run - Hill Hillier Hilliest
        description: Hill workouts develop speed and form. Stay in control of your breathing and lean slightly with the chin leading the chest.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 3
              steps:
                - run: {time: 1m, note: "1:00 10K Effort"}
                - recovery: {time: 2m, note: "2:00 after 10K effort"}
                - run: {time: 45s, note: "0:45 5K Effort"}
                - recovery: {time: 1m30s, note: "1:30 after 5K effort"}
                - run: {time: 30s, note: "0:30 Mile Effort"}
                - recovery: {time: 1m, note: "1:00 after Mile effort"}
      - id: guided-eight-mile-run
        day: 6
        name: NRC Guided Run - Eight Mile Run
        steps:
          - run: {distance: 12.5km, note: "NRC Guided Run: Eight Mile Run - 12.5K / 8 Mile Run"}
  - week: 7
    focus: 8 weeks to go - The Shifter and Power Pyramid
    workouts:
      - id: guided-8w-recovery
        day: 1
        name: NRC Guided Run - 8 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 8 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-the-shifter
        day: 2
        name: NRC Guided Run - The Shifter
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 4m, note: "4:00 Recovery Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery after Recovery Run Pace interval"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - run: {time: 3m, note: "3:00 10K Pace"}
          - recovery: {time: 1m30s, note: "1:30 Recovery after 10K Pace interval"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - run: {time: 2m, note: "2:00 5K Pace"}
          - recovery: {time: 2m, note: "2:00 Recovery after 5K Pace interval"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - run: {time: 1m, note: "1:00 Best Pace"}
      - id: guided-breaking-through-barriers
        day: 3
        name: NRC Guided Run - Breaking Through Barriers with Headspace
        steps:
          - run: {time: 31m, note: "NRC Guided Run: Breaking Through Barriers with Headspace - 31:00 Recovery Run"}
      - id: guided-power-pyramid
        day: 4
        name: NRC Guided Run - Power Pyramid
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - recovery: {time: 30s, note: "30 seconds after Mile Pace"}
          - run: {time: 5m, note: "5:00 5K Pace"}
          - recovery: {time: 2m30s, note: "2:30 after 5K pace"}
          - run: {time: 10m, note: "10:00 10K Pace"}
          - recovery: {time: 3m, note: "3:00 after 10K pace"}
          - run: {time: 5m, note: "5:00 5K Pace"}
          - recovery: {time: 2m30s, note: "2:30 after 5K pace"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
      - id: guided-15k-run
        day: 6
        name: NRC Guided Run - 15K Run
        steps:
          - run: {distance: 15km, note: "NRC Guided Run: 15K Run - 15K / 9.5 Mile Run"}
  - week: 8
