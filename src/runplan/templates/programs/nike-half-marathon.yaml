program:
  id: nike-half-marathon
  name: Nike Run Club - Half Marathon Training Plan
  short_name: NHM
  description: >-
    Unofficial adaptation of the Nike Run Club Half Marathon Training Plan with
    Audio Guided Runs. Pace targets reference the Nike Run Club Pace Chart
    (Best, Mile, 5K, 10K, Tempo, Recovery, Half Marathon) and must be filled in
    by the runner. Speed Runs build strength, Recovery Runs let you absorb the
    work, and a weekly Long Run grows endurance. Avoid scheduling Speed Runs on
    back-to-back days. The final week ends with the half marathon.
  start_week: 2027-W01

weeks:
  - week: 1
    focus: 14 weeks to go - Easy introduction
    workouts:
      - id: guided-14w-recovery
        day: 1
        name: NRC Guided Run - 14 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 14 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-first-speed
        day: 2
        name: NRC Guided Run - First Speed Run
        description: Intervals are a Speed Run with running and rest intervals. The pace and effort of the running interval can stay the same or change.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 8
              steps:
                - run: {time: 1m, note: "1:00 5K Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
      - id: guided-easy-run
        day: 3
        name: NRC Guided Run - Easy Run
        steps:
          - run: {time: 25m, note: "NRC Guided Run: Easy Run - 25:00 Recovery Run"}
      - id: guided-one-hard-two-easy
        day: 4
        name: NRC Guided Run - One Hard Two Easy
        description: Fartlek is Swedish for speed play. Alternate distances and paces during a continuous run.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 7
              steps:
                - run: {time: 1m, note: "1:00 Hard Running"}
                - recovery: {time: 2m, note: "2:00 Easy Running"}
      - id: guided-5k-run
        day: 6
        name: NRC Guided Run - 5K Run
        steps:
          - run: {distance: 5km, note: "NRC Guided Run: 5K Run - 5K / 3.1 Mile Run"}
  - week: 2
    focus: 13 weeks to go - Pace ladders and 4-mile long run
    workouts:
      - id: guided-13w-recovery
        day: 1
        name: NRC Guided Run - 13 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 13 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-no-time-go-time
        day: 2
        name: NRC Guided Run - No Time Go Time
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 2m, note: "2:00 5K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 3m, note: "3:00 10K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 2m, note: "2:00 5K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
      - id: guided-recovery-headspace
        day: 3
        name: NRC Guided Run - Recovery Run with Headspace
        steps:
          - run: {time: 35m, note: "NRC Guided Run: Recovery Run with Headspace - 35:00 Run"}
      - id: guided-run-strong-repeat
        day: 4
        name: NRC Guided Run - Run Strong. Repeat.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 4
              steps:
                - run: {time: 1m30s, note: "1:30 5K Pace"}
                - recovery: {time: 45s, note: "45 second Recovery after 5K Pace Intervals"}
          - run: {time: 1m30s, note: "1:30 Mile Pace"}
          - recovery: {time: 1m, note: "1:00 recovery after Mile Pace Interval"}
          - repeat:
              count: 4
              steps:
                - run: {time: 1m30s, note: "1:30 5K Pace"}
                - recovery: {time: 45s, note: "45 second Recovery after 5K Pace Intervals"}
          - run: {time: 1m30s, note: "1:30 Mile Pace"}
      - id: guided-four-mile-run
        day: 6
        name: NRC Guided Run - Four Mile Run
        steps:
          - run: {distance: 6.4km, note: "NRC Guided Run: Four Mile Run - 6.4K / 4 Mile Run"}
  - week: 3
    focus: 12 weeks to go - Hills and Triple 7's
    workouts:
      - id: guided-12w-recovery
        day: 1
        name: NRC Guided Run - 12 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 12 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-runner-up
        day: 2
        name: NRC Guided Run - Runner Up
        description: Hill workouts develop speed and form. Stay in control of your breathing and lean slightly with the chin leading the chest. Use effort rather than pace.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 5
              steps:
                - run: {time: 45s, note: "45 seconds 10K Effort"}
                - recovery: {time: 1m15s, note: "1:15 after 10K effort"}
                - run: {time: 15s, note: "15 seconds Best Effort"}
                - recovery: {time: 45s, note: "45 seconds after Best Effort"}
      - id: guided-just-a-run
        day: 3
        name: NRC Guided Run - Just A Run
        steps:
          - run: {time: 30m, note: "NRC Guided Run: Just A Run - 30:00 Recovery Run"}
      - id: guided-triple-7s
        day: 4
        name: NRC Guided Run - Triple 7's
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 3
              steps:
                - run: {time: 7m, note: "7:00 5K Pace"}
                - recovery: {time: 2m30s, note: "2:30 Recovery between intervals"}
      - id: guided-five-mile-run
        day: 6
        name: NRC Guided Run - Five Mile Run
        steps:
          - run: {distance: 8km, note: "NRC Guided Run: Five Mile Run - 8K / 5 Mile Run"}
  - week: 4
    focus: 11 weeks to go - The Rundown and Tempo with Emily Infeld
    workouts:
      - id: guided-11w-recovery
        day: 1
        name: NRC Guided Run - 11 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 11 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-the-rundown
        day: 2
        name: NRC Guided Run - The Rundown
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 3
              steps:
                - run: {time: 1m, note: "1:00 Mile Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery after Mile Pace"}
          - repeat:
              count: 3
              steps:
                - run: {time: 2m, note: "2:00 5K Pace"}
                - recovery: {time: 1m30s, note: "1:30 Recovery after 5K Pace"}
          - repeat:
              count: 2
              steps:
                - run: {time: 1m, note: "1:00 Mile Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery after Mile Pace"}
          - repeat:
              count: 2
              steps:
                - run: {time: 2m, note: "2:00 5K Pace"}
                - recovery: {time: 1m30s, note: "1:30 Recovery after 5K Pace"}
          - run: {time: 1m, note: "1:00 Mile Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery after Mile Pace"}
          - run: {time: 2m, note: "2:00 5K Pace"}
      - id: guided-running-towards-goal
        day: 3
        name: NRC Guided Run - Running Towards Your Goal with Headspace
        steps:
          - run: {time: 40m, note: "NRC Guided Run: Running Towards Your Goal with Headspace - 40:00 Recovery Run"}
      - id: guided-tempo-emily
        day: 4
        name: NRC Guided Run - Tempo Run with Emily Infeld
        description: A Tempo Run is a hard but controlled pace run as long intervals or a steady run of 1-10 miles. The purpose is to build mental and physical endurance and become comfortable being uncomfortable.
        steps:
          - warmup: {time: 7m, note: "7:00 Warm Up"}
          - run: {time: 25m, note: "25:00 Tempo Run"}
      - id: guided-10k-run
        day: 6
        name: NRC Guided Run - 10K Run
        steps:
          - run: {distance: 10km, note: "NRC Guided Run: 10K Run - 10K / 6.2 Mile Run"}
  - week: 5
    focus: 10 weeks to go - Sneaky Speed and Out Strong Back Fast
    workouts:
      - id: guided-10w-recovery
        day: 1
        name: NRC Guided Run - 10 Weeks to Go
        steps:
          - run: {time: 15m, note: "NRC Guided Run: 10 Weeks to Go - 15:00 Recovery Run"}
      - id: guided-sneaky-speed
        day: 2
        name: NRC Guided Run - Sneaky Speed
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 1m30s, note: "1:30 5K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - repeat:
              count: 3
              steps:
                - run: {time: 45s, note: "45 seconds Mile Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 1m30s, note: "1:30 5K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - repeat:
              count: 3
              steps:
                - run: {time: 45s, note: "45 seconds Mile Pace"}
                - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - run: {time: 1m30s, note: "1:30 5K Pace"}
          - recovery: {time: 1m, note: "1:00 Recovery Between Intervals"}
          - repeat:
              count: 3
              steps:
                - run: {time: 45s, note: "45 seconds Mile Pace"}
      - id: guided-30-minute-head-starts
        day: 3
        name: NRC Guided Run - 30 Minute Head Starts
        steps:
          - run: {time: 30m, note: "NRC Guided Run: 30 Minute Head Starts - 30:00 Recovery Run"}
      - id: guided-out-strong-back-fast
        day: 4
        name: NRC Guided Run - Out Strong Back Fast
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - run: {time: 23m, note: "23:00 Progression Tempo Run"}
      - id: guided-another-10k-run
        day: 6
        name: NRC Guided Run - Another 10K Run
        steps:
          - run: {distance: 10km, note: "NRC Guided Run: Another 10K Run - 10K / 6.2 Mile Run"}
  - week: 6
