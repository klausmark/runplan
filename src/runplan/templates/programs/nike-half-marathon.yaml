program:
  id: nike-half-marathon
  name: Nike Run Club - Half Marathon Training Plan
  short_name: NHM
  description: >-
    Unofficial adaptation of the Nike Run Club Half Marathon Training Plan with
    Audio Guided Runs. Pace targets reference the Nike Run Club Pace Chart
    (Best, Mile, 5K, 10K, Tempo, Recovery, Half Marathon) and must be filled in
    by the runner. Speed Runs build strength, Recovery Runs let you absorb the
    work, and a weekly Long Run grows endurance. Avoid scheduling Speed Runs on
    back-to-back days. The final week ends with the half marathon.
  start_week: 2027-W01
  coaching:
    tagline: "Speed, endurance, and recovery"
    intro_sections:
      - title: "A Great Coach"
        body: >-
          A great coach will tell you you've got a lot of different runners inside
          of you. To be the best runner, you've got to let them all out.

          Run on hills, run on a track, do short runs, long runs and
          everything in-between. A great coach will tell you running shouldn't
          hurt, and some days the best run is no run. If your week of runs looks
          like a playlist with the same song by the same artist 17 times in a row,
          a great coach will tell you to mix things up, to turn each week into an
          epic, kickass playlist.

          We'll guide you through it.

          Download and run with the Nike Run Club App and this 8-week 5K Training
          Program to coach yourself across the finish line.
      - title: "It's Not Just About Running"
        body: >-
          We know that a smarter runner is a better runner. We've got the training
          and guidance you need here in this plan. This training program is built
          to help you to maximize your efforts on race day through Speed Runs,
          Recovery Runs and Long Runs. But it takes so much more than running to
          become a better runner. That's why this training plan is built to not
          only help you become a better runner but also a better coach.
    plan_tips:
      - title: "This plan works for you"
        body: >-
          Your schedule varies. So does the weather and how you feel, but here are
          a few things to keep in mind as you modify this plan to your needs:
          Speed Runs and Long Runs are essential parts of the plan to maximize your
          training. You have two Recovery Runs and two Rest Days - use them to
          break up your Speed and Long Runs. Avoid doing Speed Runs on back-to-back
          days. Avoid doing Speed Runs on back-to-back
          days.
      - title: "Training starts when you start"
        body: >-
          This plan was designed around an 8-week schedule for maximum results. It
          was built to adapt to your experience level and intended to be uniquely
          flexible to your needs as you prepare to tackle a 5K. Whether you're
          four or eight weeks from race day, you can jump into this program
          whenever it suits you. You're in control of what you put into the program
          and therefore what you get out of it. We do recommend that you plan on
          training for at least 4 weeks before the 5K and can comfortably run and
          complete the programmed workouts.
      - title: "Tools to take you farther"
        items:
          - "Record your runs, reflect on progress, and grab some encouragement from your community along the way with the Nike Run Club App."
          - "The Nike Training Club App is a great way to add cross-training to your schedule."
    weekly_workouts:
      - title: "Speed Runs"
        body: >-
          Building strength through speed training is important as you prepare.
          Throughout this plan you'll be introduced to a variety of speed workouts
          and drills that will make you faster. You'll get to do short and long
          intervals, fartlek, hill workouts and tempo runs (see Types of Runs in
          the Glossary for definitions of these).
      - title: "Long Runs"
        body: >-
          You need endurance training to help prepare your body and mind to go the
          distance on race day. You will work on endurance and pacing with weekly
          Long Runs. It also helps you get familiar with the physical and mental
          challenges that you might face during a race. This run should be run at
          a comfortable pace, and as a Progression Run (see Types of Runs in the
          Glossary for definition of Progression Run).
      - title: "Recovery Runs"
        body: >-
          Recovering from your workout days is just as important as the workouts
          themselves. Use these days to run easy and based on how you feel to help
          you recover at the highest quality possible after intense training. Each
          week of training includes two recovery runs. Recovery Runs are just as
          important as your hard workouts.
      - title: "Rest Days"
        body: >-
          Great running is dependent on great rest and recovery. These days are
          meant for you to recharge and recover. Either take the day off, try one
          of the workouts from "Simple Routines For Better Runs" in the NTC App or
          go for a few easy miles or kilometers. It is essential that you talk to
          and listen to your body as you progress through the training program.
          Sometimes you will need to adjust the program to fit what you need. And
          yes, that means that sometimes the best speed run or long run will be no
          run.
    pace_chart:
      title: "Nike Run Club Pace Chart"
      intro: >-
        Throughout the plan, you will see and hear references to different paces
        and efforts you should aim to maintain during specific workouts. Treat
        each pace target as the middle of a range. You may train slightly above
        or below these paces. They are not exact paces and you are not a robot.
      headers:
        - {label: "1K best", description: "Your best 1K effort in minutes per kilometer."}
        - {label: "5K best / avg km", description: "Best 5K time and the average pace per kilometer you held during it."}
        - {label: "10K best / avg km", description: "Best 10K time and the average pace per kilometer you held during it."}
        - {label: "Tempo min/km", description: "Steady, hard-but-controlled pace per kilometer."}
        - {label: "Half marathon best / avg km", description: "Best half marathon time and the average pace per kilometer you held during it."}
        - {label: "Marathon best / avg km", description: "Best marathon time and the average pace per kilometer you held during it."}
        - {label: "Recovery min/km", description: "Easy conversational pace per kilometer."}
      rows:
        - ["3:00", "16:40 / 3:20", "35:00 / 3:30", "3:40", "1:19:07 / 3:45", "2:45:16 / 3:55", "4:20"]
        - ["3:20", "18:45 / 3:45", "39:10 / 3:55", "4:05", "1:27:54 / 4:10", "3:02:51 / 4:20", "4:45"]
