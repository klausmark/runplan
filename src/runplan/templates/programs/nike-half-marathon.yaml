        description: Fartlek is Swedish for speed play. Alternate 2:00 hard with 1:00 easy for 21:00.
        steps:
          - warmup: {time: 5m, note: "5:00 Warm Up"}
          - repeat:
              count: 7
              steps:
                - run: {time: 2m, note: "2:00 of hard running"}
                - recovery: {time: 1m, note: "1:00 of easy running"}
      - id: guided-20k-run
        day: 6
        name: NRC Guided Run - 20K Run
        steps:
