        - ["5:00", "27:55 / 5:35", "58:20 / 5:50", "5:55", "2:10:06 / 6:10", "4:34:16 / 6:30", "6:35"]
        - ["5:20", "30:00 / 6:00", "1:02:30 / 6:15", "6:20", "2:18:54 / 6:35", "4:51:51 / 6:55", "7:00"]
        - ["5:40", "31:40 / 6:20", "1:06:40 / 6:40", "6:40", "2:27:41 / 7:00", "5:09:26 / 7:20", "7:20"]
        - ["6:00", "33:45 / 6:45", "1:10:50 / 7:05", "7:05", "2:36:28 / 7:25", "5:30:32 / 7:50", "7:45"]
        - ["6:20", "35:25 / 7:05", "1:14:10 / 7:25", "7:25", "2:45:16 / 7:50", "5:48:07 / 8:15", "8:05"]
        - ["6:40", "37:30 / 7:30", "1:18:20 / 7:50", "7:50", "2:54:03 / 8:15", "6:05:41 / 8:40", "8:30"]
        - ["7:00", "39:10 / 7:50", "1:22:30 / 8:15", "8:10", "3:02:51 / 8:40", "6:23:16 / 9:05", "8:50"]
        - ["7:20", "40:50 / 8:10", "1:25:50 / 8:35", "8:30", "3:11:38 / 9:05", "6:40:51 / 9:30", "9:10"]
