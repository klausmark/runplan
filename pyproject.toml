[project]
name = "runplan"
version = "0.1.0"
description = "Synchronize YAML running plans with Garmin Connect"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "garminconnect[workout]>=0.3.6",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.0",
    "ruamel-yaml>=0.18.0",
]

[project.scripts]
runplan = "runplan.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runplan = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js", "web_assets/*.svg"]

[dependency-groups]
dev = [
    "pypdf>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
cache_dir = ".tmp/pytest-cache"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
