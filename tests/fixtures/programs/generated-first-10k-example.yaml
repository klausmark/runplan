program:
  id: first-10k-2026-w32
  name: First 10K - 2026-W32 (10K)
  short_name: F10K
  description: Deterministic first 10K program generated from a typed request. The
    plan follows a soft pyramidal intensity distribution inspired by Knopp et al.
    (2024) and uses a four-week microcycle with a forced recovery week. The final
    week ends with a 10K test run.
  start_week: 2026-W32
weeks:
- week: 1
  focus: 'Foundation: easy volume and short intervals to build rhythm.'
  workouts:
  - id: week-01-easy-1
    day: 1
    name: Easy run
    steps:
    - warmup:
        time: 5m
    - run:
        time: 20m
    - cooldown:
        time: 5m
    description: Run at an easy, conversational pace. Walk recoveries are fine.
  - id: week-01-easy-2
    day: 2
    name: Easy run
    steps:
    - warmup:
        time: 5m
    - run:
        time: 30m
    - cooldown:
        time: 5m
    description: Run at an easy, conversational pace. Walk recoveries are fine.
  - id: week-01-long-7
    day: 7
