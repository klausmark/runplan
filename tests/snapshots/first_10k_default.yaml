program:
  id: first-10k-2026-w32
  name: First 10K - 2026-W32 (10K)
  short_name: F10K
  description: Deterministic first 10K program generated from a typed request. The
    plan follows a soft pyramidal intensity distribution inspired by Knopp et al.
    (2024) and uses a four-week microcycle with a forced recovery week. The final
    week ends with a 10K test run.
  start_week: 2026-W32
weeks:
- week: 1
  focus: 'Foundation: easy volume and short intervals to build rhythm.'
  workouts:
  - id: week-01-easy-1
    day: 1
    name: Easy continuous run
    steps:
    - warmup:
        time: 5m
    - run:
        time: 34m
    - cooldown:
        time: 5m
    description: Steady aerobic effort for the prescribed time. Warm up and cool down
      frame the main run.
  - id: week-01-easy-2
    day: 2
    name: Easy continuous run
    steps:
    - warmup:
        time: 5m
    - run:
        time: 69m
    - cooldown:
        time: 5m
    description: Steady aerobic effort for the prescribed time. Warm up and cool down
      frame the main run.
  - id: week-01-long-7
    day: 7
    name: Steady long run
    steps:
    - warmup:
        time: 10m
    - run:
        distance: 6km
    - cooldown:
        time: 10m
    description: Continuous long run at a steady aerobic effort. Pair with an optional
      effort-based pace range when known.
- week: 2
  focus: 'Foundation: easy volume and short intervals to build rhythm.'
  workouts:
  - id: week-02-easy-1
    day: 1
    name: Easy run with strides
    steps:
    - warmup:
        time: 5m
    - run:
        time: 36m
    - repeat:
        count: 4
        steps:
        - run:
            time: 0m20s
        - recovery:
            time: 1m
    - cooldown:
        time: 5m
    description: Steady aerobic run followed by four short strides to keep the neuromuscular
      system sharp.
  - id: week-02-easy-2
